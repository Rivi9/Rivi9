<title id="t">Rivindu Bopage</title>
<desc id="d">A terminal types whoami and prints Rivindu Bopage: AI, full-stack, DevOps, based in Sri Lanka. Beside it, signals flow through a small neural network whose last layers become containers and a production server rack.</desc>
