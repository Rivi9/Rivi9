<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Rivindu Bopage profile banner</title>
  <desc id="desc">A dark technical banner introducing Rivindu Bopage and his work across software, applied AI, and interactive systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#121034"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0ba"/>
      <stop offset="0.5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a66cff"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#35d0ba" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#35d0ba" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ba3c7" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="130" cy="60" r="260" fill="url(#glowA)"/>
    <circle cx="1040" cy="260" r="310" fill="url(#glowB)"/>

    <path d="M0 260C220 210 350 340 610 270S980 190 1200 235" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M0 280C240 225 390 355 625 292S980 220 1200 260" fill="none" stroke="#4f8cff" stroke-width="1" stroke-opacity="0.18"/>

    <g transform="translate(915 46)">
      <circle cx="110" cy="110" r="108" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>
      <circle cx="110" cy="110" r="86" fill="#091426" stroke="#9db6db" stroke-opacity="0.15"/>
      <text x="110" y="132" text-anchor="middle" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-5">R9</text>
      <circle cx="17" cy="57" r="4" fill="#35d0ba"/>
      <circle cx="203" cy="162" r="4" fill="#9a6cff"/>
    </g>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="72" y="90" fill="#8ca4c7" font-size="15" font-weight="600" letter-spacing="4">AI · DEVOPS · SRI LANKA</text>
      <text x="68" y="164" fill="#f4f7ff" font-size="54" font-weight="760" letter-spacing="-1.5">Rivindu Bopage</text>
      <rect x="72" y="185" width="560" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="72" y="228" fill="#c3d0e6" font-size="20" font-weight="400">Artificial intelligence · DevOps · Software systems</text>
      <g transform="translate(72 252)">
        <rect width="92" height="34" rx="17" fill="#35d0ba" fill-opacity="0.11" stroke="#35d0ba" stroke-opacity="0.4"/>
        <text x="46" y="22" text-anchor="middle" fill="#73e6d4" font-size="13" font-weight="600">@Rivi9</text>
        <rect x="106" width="144" height="34" rx="17" fill="#4f8cff" fill-opacity="0.11" stroke="#4f8cff" stroke-opacity="0.4"/>
        <text x="178" y="22" text-anchor="middle" fill="#87afff" font-size="13" font-weight="600">BUILD + OPERATE</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#9cb4d8" stroke-opacity="0.14" stroke-width="2"/>
</svg>
